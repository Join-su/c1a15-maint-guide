# nginx 하나 · 앱마다 포트 · 각자 /api 중계(EP-C1-WEB-001). 클라이언트가 보낸 X-App은 덮어쓴다.
# 쿠키는 host 단위라 두 포트가 나눠 가지므로, 앱 구분은 서버가 X-App · 쿠키 이름 · 역할을 대조해 한다(FP-01).
events {}
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  upstream api { server api:8000; }

  server {
    listen 8081;
    root /srv/tech;
    location / { try_files $uri /index.html; }
    location /api/ {
      proxy_pass http://api;
      proxy_set_header X-App tech;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }
  }

  server {
    listen 8082;
    root /srv/lead;
    location / { try_files $uri /index.html; }
    location /api/ {
      proxy_pass http://api;
      proxy_set_header X-App lead;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }
  }
}
