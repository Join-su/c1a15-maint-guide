<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리트리버 정답 확인</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #5d6677; --line: #dfe3ea;
  --accent: #2457c5; --ok: #1f7a4d; --ok-bg: #e6f4ec; --x: #b42318; --x-bg: #fdecea; --add: #7a4b00; --add-bg: #fff4dc;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
header .progress { color: var(--muted); }
header .spacer { flex: 1; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.on-ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); font-weight: 600; }
button.on-x { background: var(--x-bg); color: var(--x); border-color: var(--x); font-weight: 600; }
button.on-add { background: var(--add-bg); color: var(--add); border-color: var(--add); font-weight: 600; }
.layout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
nav button { width: 100%; text-align: left; display: flex; justify-content: space-between; }
nav button.current { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
nav .done { color: var(--ok); }
main section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
h2 { font-size: 18px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 13px; }
.answer { font-weight: 600; }
.row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .body { flex: 1; min-width: 0; }
.row .tag { font-size: 12px; color: var(--muted); }
.row .text { white-space: pre-wrap; word-break: break-word; }
.row .acts { display: flex; gap: 6px; flex-shrink: 0; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
select, input[type=text], textarea { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
textarea { width: 100%; min-height: 60px; }
.msg { font-size: 13px; color: var(--x); min-height: 1em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.chip { background: var(--add-bg); color: var(--add); border-radius: 999px; padding: 2px 10px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chip button { padding: 0 6px; font-size: 12px; }
.sensors { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.foot { display: flex; justify-content: space-between; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } nav ol { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>리트리버 정답 확인 · val 표본</h1>
  <span class="progress" id="progress"></span>
  <span class="spacer"></span>
  <button class="primary" id="save">결과 JSON 저장</button>
</header>
<div class="layout">
  <nav><ol id="nav"></ol></nav>
  <main id="main"></main>
</div>
<script>
const DATA = /*__DATA__*/null;
const KEY = "gold-review:" + DATA.sample_sha256;
const blank = () => ({ manual: {}, rule_ok: null, hist_x: {}, compare_add: {}, add_ids: [], add_sections: [], memo: "" });
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
DATA.cards.forEach(c => { state[c.card_id] = Object.assign(blank(), state[c.card_id] || {}); });
let cur = 0;
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const mkey = m => m.section + ":" + m.char_start;
const reviewed = c => state[c.card_id].rule_ok !== null && c.manual.every(m => state[c.card_id].manual[mkey(m)]);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");  // 보기만 굵게 — 정답 글자 범위는 원문 그대로
const TYPE = { manual_cause: "매뉴얼 원인", none: "이상 없음(일시 이탈)", out_of_graph: "매뉴얼 밖 원인" };

function render() {
  const done = DATA.cards.filter(reviewed).length;
  document.getElementById("progress").textContent = `확인함 ${done} / ${DATA.cards.length}`;
  document.getElementById("nav").innerHTML = DATA.cards.map((c, i) =>
    `<li><button data-go="${i}" class="${i === cur ? "current" : ""}"><span>${esc(c.card_id)} · ${esc(c.group)}</span><span class="done">${reviewed(c) ? "✓" : ""}</span></button></li>`).join("");
  const c = DATA.cards[cur], s = state[c.card_id];
  const h = c.hidden;
  const sens = Object.entries(c.sensors).map(([k, v]) => `<span>${esc(k)} ${esc(v)}</span>`).join("");
  const two = (attr, id, val) => `<button data-${attr}="${esc(id)}" data-v="ok" class="${val === "ok" ? "on-ok" : ""}">○ 맞음</button><button data-${attr}="${esc(id)}" data-v="x" class="${val === "x" ? "on-x" : ""}">× 빼기</button>`;
  document.getElementById("main").innerHTML = `
  <section>
    <div class="sub">${cur + 1} / ${DATA.cards.length}${c.memo_style === "ambiguous" ? " · 메모 애매형" : ""}</div>
    <h2>${esc(c.card_id)} · ${esc(c.group_name)} · ${esc(c.alarm.direction)}</h2>
    <div>${esc(c.alarm.sensor)} ${esc(c.alarm.value)} ${esc(c.alarm.unit)} (경계 ${esc(c.alarm.boundary)})</div>
    <div class="sensors">${sens}</div>
    <p>숨은 정답: <span class="answer">${esc(TYPE[h.type] || h.type)}${h.code ? " · " + esc(h.code) : ""}</span>${h.description ? " — " + esc(h.description) : ""}</p>
  </section>
  <section>
    <h3>매뉴얼 정답 줄 <span class="sub">— 이 줄이 근거로 맞는지</span></h3>
    ${c.manual.map(m => `<div class="row"><div class="body"><div class="tag">${esc(m.rule)} · ${esc(m.section)} ${esc(m.title)}</div><div class="text">${md(m.text)}</div></div><div class="acts">${two("m", mkey(m), s.manual[mkey(m)])}</div></div>`).join("")}
  </section>
  <section>
    <h3>이력 정답 <span class="sub">— 규칙 ${esc(c.history_rule)} · ${c.history_count}건 중 ${c.history_shown.length}건 보기</span></h3>
    <div class="inline">이 규칙이 이 카드에 맞나요? <button data-rule="ok" class="${s.rule_ok === true ? "on-ok" : ""}">○ 맞음</button><button data-rule="x" class="${s.rule_ok === false ? "on-x" : ""}">× 안 맞음(이력 정답 전부 빼기)</button></div>
    ${c.history_shown.map(r => `<div class="row"><div class="body"><div class="tag">${esc(r.record_id)} · ${esc(r.outcome.type)}${r.outcome.cause_code ? " " + esc(r.outcome.cause_code) : ""}</div><div class="text">${esc(r.narrative)}</div></div><div class="acts"><button data-hx="${esc(r.record_id)}" class="${s.hist_x[r.record_id] ? "on-x" : ""}">× 빼기</button></div></div>`).join("")}
  </section>
  <section>
    <h3>빠진 근거가 있나요?</h3>
    <div class="sub">같은 증상군 · 정답 밖 기록 2건(무작위)</div>
    ${c.compare.map(r => `<div class="row"><div class="body"><div class="tag">${esc(r.record_id)} · ${esc(r.outcome.type)}${r.outcome.cause_code ? " " + esc(r.outcome.cause_code) : ""}</div><div class="text">${esc(r.narrative)}</div></div><div class="acts"><button data-ca="${esc(r.record_id)}" class="${s.compare_add[r.record_id] ? "on-add" : ""}">+ 더하기</button></div></div>`).join("")}
    <div class="inline"><label>+ 매뉴얼 절 <select id="secSel"><option value="">절 고르기</option>${c.manual_sections.map(x => `<option value="${esc(x.id)}">${esc(x.id)} ${esc(x.title)}</option>`).join("")}</select></label><button id="secAdd">더하기</button>
      <label>+ 이력 ID <input type="text" id="idIn" placeholder="H-0000" size="8"></label><button id="idAdd">더하기</button></div>
    <div class="msg" id="msg"></div>
    <div class="chips">${s.add_sections.map(x => `<span class="chip">매뉴얼 ${esc(x)} <button data-rs="${esc(x)}">빼기</button></span>`).join("")}${s.add_ids.map(x => `<span class="chip">이력 ${esc(x)} <button data-ri="${esc(x)}">빼기</button></span>`).join("")}</div>
  </section>
  <section>
    <h3>메모</h3>
    <textarea id="memo" placeholder="규칙 · 근거에 대한 의견">${esc(s.memo)}</textarea>
  </section>
  <div class="foot"><button id="prev" ${cur === 0 ? "disabled" : ""}>← 이전</button><button id="next" ${cur === DATA.cards.length - 1 ? "disabled" : ""}>다음 →</button></div>`;
}

function msg(t) { document.getElementById("msg").textContent = t; }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const c = DATA.cards[cur], s = state[c.card_id];
  if (b.dataset.go !== undefined) { cur = +b.dataset.go; }
  else if (b.dataset.m !== undefined) { s.manual[b.dataset.m] = s.manual[b.dataset.m] === b.dataset.v ? undefined : b.dataset.v; }
  else if (b.dataset.rule !== undefined) { const v = b.dataset.rule === "ok"; s.rule_ok = s.rule_ok === v ? null : v; }
  else if (b.dataset.hx !== undefined) { s.hist_x[b.dataset.hx] = !s.hist_x[b.dataset.hx]; }
  else if (b.dataset.ca !== undefined) { s.compare_add[b.dataset.ca] = !s.compare_add[b.dataset.ca]; }
  else if (b.dataset.rs !== undefined) { s.add_sections = s.add_sections.filter(x => x !== b.dataset.rs); }
  else if (b.dataset.ri !== undefined) { s.add_ids = s.add_ids.filter(x => x !== b.dataset.ri); }
  else if (b.id === "secAdd") {
    const v = document.getElementById("secSel").value;
    if (!v) return msg("절을 고르세요");
    if (!s.add_sections.includes(v)) s.add_sections.push(v);
  } else if (b.id === "idAdd") {
    const v = document.getElementById("idIn").value.trim().toUpperCase();
    if (!c.group_record_ids.includes(v)) return msg(`${v || "빈 값"}: 이 카드 증상군(${c.group})의 이력 ID가 아닙니다`);
    if (c.compare.some(r => r.record_id === v)) return msg(`${v}: 위 비교 기록의 + 더하기를 쓰세요`);
    if (!s.add_ids.includes(v)) s.add_ids.push(v);
  } else if (b.id === "prev") { cur = Math.max(0, cur - 1); }
  else if (b.id === "next") { cur = Math.min(DATA.cards.length - 1, cur + 1); }
  else if (b.id === "save") { return save(); }
  else return;
  persist(); render();
});
document.addEventListener("input", e => {
  if (e.target.id === "memo") { state[DATA.cards[cur].card_id].memo = e.target.value; persist(); }
});

function result() {
  const cards = {};
  DATA.cards.forEach(c => {
    const s = state[c.card_id];
    const remove = c.manual.filter(m => s.manual[mkey(m)] === "x").map(m => ({ store: "manual", section: m.section, char_start: m.char_start }))
      .concat(c.history_shown.filter(r => s.hist_x[r.record_id]).map(r => ({ store: "history", record_id: r.record_id })));
    const add = c.compare.filter(r => s.compare_add[r.record_id]).map(r => ({ store: "history", record_id: r.record_id }))
      .concat(s.add_ids.map(x => ({ store: "history", record_id: x })))
      .concat(s.add_sections.map(x => ({ store: "manual", section: x })));
    cards[c.card_id] = { reviewed: reviewed(c), rule_ok: s.rule_ok, remove, add, memo: s.memo };
  });
  return { reviewer: "user", saved_at: new Date().toISOString(), sample_sha256: DATA.sample_sha256, gold_sha256: DATA.gold_sha256, cards };
}

function save() {
  const r = result();
  const left = Object.values(r.cards).filter(x => !x.reviewed).length;
  if (left && !confirm(`아직 확인하지 않은 카드가 ${left}장 있습니다. 그래도 저장할까요?`)) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(r, null, 1)], { type: "application/json" }));
  a.download = "human-review-result.json";
  document.body.appendChild(a); a.click(); a.remove();
  window.__lastResult = r;
}
render();
</script>
</body>
</html>
