1. 측면 냉각 커버의 고정 나사 2개를 푼다.
2. 필터 표면 전체를 눈으로 확인한다.
3. 기름때·먼지가 표면의 절반 이상을 덮으면 &quot;이상&quot;이다.

권한 등급 A 단독 가능 · 소요 약 3분 · 연결 원인 CL-1 냉각 필터 막힘(확정)

4.3.1 점검 방법

1. 측면 냉각 커버의 고정 나사 2개를 푼다.
2. 필터 표면 전체를 눈으로 확인한다.
3. 기름때·먼지가 표면의 절반 이상을 덮으면 &quot;이상&quot;이다.
4. 커버를 닫고 나사를 조인다.

판정 기준 기름때·먼지가 필터 표면의 절반 이상을 덮으면 &quot;이상&quot;이다.

4.3.2 조치: 흡기 필터 교체

권한 등급 A 단독 가능 · 소요 약 10분

1. 흡기구 덮개를 열고 필터를 빼낸다.
2. 새 필터를 화살표 방향(공기 흐름 방향)에 맞춰 넣는다.
3. 덮개를 닫고 고정 나사를 조인다.</div></div></div></template><template id="s-T15--alarm"><div class="ap"><div class="ap-top"><div class="brand"><span class="logo"><svg aria-hidden="true" class="ic lucide lucide-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z" /> <path d="M15 5.764v15" /> <path d="M9 3.236v15" /> </svg></span>정비 길잡이</div><div class="tb-ctx"><span class="dot red"></span>M-03 · 온도 차 저하 · 02:14</div><div class="tb-r"><span class="tb-clock"><svg aria-hidden="true" class="ic lucide lucide-clock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <circle cx="12" cy="12" r="10" /> <path d="M12 6v6l4 2" /> </svg>02:35</span><span class="tb-bell"><svg aria-hidden="true" class="ic lucide lucide-bell" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M10.268 21a2 2 0 0 0 3.464 0" /> <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" /> </svg><i>1</i></span><span class="tb-user"><span class="av">김</span>김○○ · 야간 정비</span></div></div><div class="ap-step"><div class="sp done pick"><span class="spn"><svg aria-hidden="true" class="ic lucide lucide-check" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M20 6 9 17l-5-5" /> </svg></span>알람</div><span class="spl done"></span><div class="sp done pick"><span class="spn" span>냉각 필터 막힘</span><b>조치</b><span>흡기 필터 교체</span><b>정지 시간</b><span>24분</span></div><div class=\"sub\">서술</div><p class=\"ai\" style=\"font-size:14px\">16:23 M-11 온도 차 저하 알람(온도 차 7.8 K, 경계 8.3 K) 받음. 잠금 후 흡기 필터 육안 점검 — 먼지가 표면 절반 넘게 덮음, 색이 짙음. 냉각 필터 막힘으로 판단, 흡기 필터 교체. 재가동, 온도 차 경계 이내로 돌아옴. 정지 24분.</p></div></div>", "H-0298": "<div class=\"dim\"></div><div class=\"modal wide\"><div class=\"mh\"><svg aria-hidden=\"true\" class=\"ic lucide lucide-history\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\" /> <path d=\"M3 3v5h5\" /> <path d=\"M12 7v5l4 2\" /> </svg><b>과거 기록 H-0298</b><span class=\"ch gray\">승인 · 박○○</span><span class=\"btn ghost sm2 mclose\">닫기</span></div><div class=\"kv\"><b>설비</b><span>M-17 · 회전 가공 설비</span><b>발생 시각</b><span>2026-09-30 21:14</span><b>증상</b><span>온도 차 저하 · 온도 차 8.0 K(경계 8.3)</span><b>센서 값</b><span>공기 302.5 K · 공정 310.5 K · 1,436 rpm · 36.5 Nm · 마모 43분</span><b>점검 경로</b><span>잠금 확인(1.2) → 고온부 확인과 온도 기록(4.2) → 흡기 필터 육안 점검(4.3, 정상) → 냉각 설정값 확인(4.6, 정상) → 냉각수 수위 확인(4.5, 정상) → 재가동(6.1) → 잠금 확인(1.2) → 냉각 팬 분해 점검(4.4, 이상) → 냉각 팬 모듈 교체(4.4.2) → 재가동(6.1)</span><b>확정 원인</b><span>냉각 팬 열화</span><b>조치</b><span>냉각 팬 모듈 교체</span><b>정지 시간</b><span>87분</span></div><div class=\"sub\">서술</div><p class=\"ai\" style=\"font-size:14px\">21:14 M-17 온도 차 저하 알람(온도 차 8.0 K, 경계 8.3 K) 접수. 잠금 후 흡기 필터 육안 점검: 필터 표면 깨끗함. 이어서 냉각 설정값 확인: 팬 속도·펌프 설정 표준값과 같음. 냉각수 수위 확인, 수위 MIN–MAX 중간. 재가동, 재가동 후에도 값 경계 밖. 냉각 팬 분해 점검(C) 필요해 파트장 호출 → 현장 승인 후 진행. 그다음 냉각 팬 분해 점검 — 팬 축 유격 큼, 회전 시 소음. 냉각 팬 모듈 교체(C) 필요해 파트장 호출 → 현장 승인 후 진행. 냉각 팬 열화로 판단, 냉각 팬 모듈 교체. 재가동, 온도 차 경계 이내로 돌아옴. 정지 87분.</p></div></div>"}, "sec": {"4.3": "<div class=\"dim\"></div><div class=\"modal wide\"><div class=\"mh\"><svg aria-hidden=\"true\" class=\"ic lucide lucide-book-open\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M12 5v16\" /> <path d=\"M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z\" /> </svg><b>매뉴얼 원문 · 4.3 흡기 필터 육안 점검</b><span class=\"gb gA\"><b>A</b>단독 가능</span><span class=\"btn ghost sm2 mclose\">닫기</span></div><div class=\"orig\">4.3 흡기 필터 육안 점검\n\n권한 등급 A 단독 가능 · 소요 약 3분 · 연결 원인 CL-1 냉각 필터 막힘(확정)\n\n4.3.1 점검 방법\n\n1. 측면 냉각 커버의 고정 나사 2개를 푼다.\n2. 필터 표면 전체를 눈으로 확인한다.\n3. 기름때·먼지가 표면의 절반 이상을 덮으면 &quot;이상&quot;이다.\n4. 커버를 닫고 나사를 조인다.\n\n판정 기준 기름때·먼지가 필터 표면의 절반 이상을 덮으면 &quot;이상&quot;이다.\n\n4.3.2 조치: 흡기 필터 교체\n\n권한 등급 A 단독 가능 · 소요 약 10분\n\n1. 흡기구 덮개를 열고 필터를 빼낸다.\n2. 새 필터를 화살표 방향(공기 흐름 방향)에 맞춰 넣는다.\n3. 덮개를 닫고 고정 나사를 조인다.</div></div></div>", "4.4": "<div class=\"dim\"></div><div class=\"modal wide\"><div class=\"mh\"><svg aria-hidden=\"true\" class=\"ic lucide lucide-book-open\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M12 5v16\" /> <path d=\"M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z\" /> </svg><b>매뉴얼 원문 · 4.4 냉각 팬 분해 점검</b><span class=\"gb gC\"><b>C</b>승인 필요</span><span class=\"btn ghost sm2 mclose\">닫기</span></div><div class=\"orig\">4.4 냉각 팬 분해 점검\n\n권한 등급 C 승인 필요 · 소요 약 10분 · 연결 원인 CL-2 냉각 팬 열화(확정)\n\n4.4.1 점검 방법\n\n1. 측면 커버를 열고 냉각 팬 모듈 커넥터를 분리한다.\n2. 고정 나사 4개를 풀고 모듈을 꺼낸다.\n3. 팬 축의 유격과 날개 손상을 확인한다.\n\n판정 기준 축을 손으로 흔들 때 유격이 느껴지거나 날개가 깨져 있으면 &quot;이상&quot;이다.\n\n4.4.2 조치: 냉각 팬 모듈 교체\n\n권한 등급 C 승인 필요 · 소요 약 40분\n\n1. 새 모듈을 장착하고 고정 나사 4개를 조인다.\n2. 커넥터를 연결하고 재가동 후 두 팬의 회전과 풍량을 확인한다.</div></div></div>", "4.5": "<div class=\"dim\"></div><div class=\"modal wide\"><div class=\"mh\"><svg aria-hidden=\"true\" class=\"ic lucide lucide-book-open\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M12 5v16\" /> <path d=\"M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z\" /> </svg><b>매뉴얼 원문 · 4.5 냉각수 수위 확인</b><span class=\"gb gA\"><b>A</b>단독 가능</span><span class=\"btn ghost sm2 mclose\">닫기</span></div><div class=\"orig\">4.5 냉각수 수위 확인\n\n권한 등급 A 단독 가능 · 소요 약 5분 · 연결 원인 CL-3 냉각수 부족(확정)\n\n4.5.1 점검 방법\n\n1. 냉각수 탱크 앞 커버를 연다.\n2. 수위계의 MIN·MAX 선과 현재 수위를 비교한다.\n3. 탱크 아래 바닥에 누설 흔적이 있는지 본다.\n\n판정 기준 수위가 MIN 선 아래면 &quot;이상&quot;이다. 누설 흔적이 있으면 보충하지 말고 숙련자에게 넘긴다.\n\n4.5.2 조치: 냉각수 보충\n\n권한 등급 B 확인 후 · 소요 약 10분\n\n시작 전 체크리스트\n\n- [ ] 지정 냉각수(희석 비율 표기)를 확인했다\n- [ ] 누설 흔적이 없다\n- [ ] 보충 후 수위가 MIN–MAX 사이다\n\n1. 지정 냉각수를 MAX 선 아래까지 보충한다.\n2. 보충량을 기록한다.</div></div></div>", "4.6": "<div class=\"dim\"></div><div class=\"modal wide\"><div class=\"mh\"><svg aria-hidden=\"true\" class=\"ic lucide lucide-book-open\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M12 5v16\" /> <path d=\"M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z\" /> </svg><b>매뉴얼 원문 · 4.6 냉각 설정값 확인</b><span class=\"gb gA\"><b>A</b>단독 가능</span><span class=\"btn ghost sm2 mclose\">닫기</span></div><div class=\"orig\">4.6 냉각 설정값 확인\n\n권한 등급 A 단독 가능 · 소요 약 4분 · 연결 원인 CL-4 냉각 설정 오류(확정)\n\n4.6.1 점검 방법\n\n1. 조작반 냉각 설정 화면을 연다.\n2. 냉각 팬 속도와 절삭유 펌프 설정을 표준값과 비교한다.\n\n판정 기준 어느 하나라도 표준값보다 낮게 설정되어 있으면 &quot;이상&quot;이다.\n\n4.6.2 조치: 냉각 설정값 변경\n\n권한 등급 C 승인 필요 · 소요 약 5분\n\n1. 파트장 승인을 받은 뒤 표준값으로 바꾼다.\n2. 바꾼 값과 승인자를 기록한다.</div></div></div>"}, "grades": {"1.2": {"title": "잠금 확인", "grade": "A"}, "2.3": {"title": "교체 기록 대조", "grade": "A"}, "2.3.2": {"t
