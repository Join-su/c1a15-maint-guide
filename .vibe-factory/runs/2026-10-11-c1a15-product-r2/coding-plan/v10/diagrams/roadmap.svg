<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" height="760" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title>Roadmap</title><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1e293b" stroke-width="1"/></pattern><marker id="a-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><marker id="a-grid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e293b"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker><marker id="a-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb7185"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c084fc"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker></defs><rect width="1500" height="760" fill="#0f172a"/><rect width="1500" height="760" fill="url(#g)"/><text x="30" y="36" font-size="16" fill="#e2e8f0" font-weight="800" text-anchor="start">Roadmap — slice 순서 · 의존 · gate · 멈춤 지점</text><text x="30" y="58" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">실행 방식 per_slice_gated: slice마다 자동 gate 통과 + 사람 결정 뒤 다음 slice. 주황 = 사람 결정 지점, ✓ = 완료</text><rect x="40" y="110" width="210" height="118" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="2"/><text x="52" y="132" font-size="14" fill="#e2e8f0" font-weight="800" text-anchor="start">S-01</text><text x="52" y="158" font-size="11" fill="#94a3b8" font-weight="600" text-anchor="start">✓ P-01</text><text x="152" y="158" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">저장소 · 실행 구성</text><text x="52" y="182" font-size="11" fill="#94a3b8" font-weight="600" text-anchor="start">✓ P-02 ◆critic</text><text x="152" y="182" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">DB · 적재</text><text x="52" y="216" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">골격 · DB · 적재</text><polygon points="145,246 157,258 145,270 133,258" fill="none" stroke="#fbbf24" stroke-width="2"/><text x="145" y="288" font-size="10" fill="#fbbf24" font-weight="600" text-anchor="middle">사람 결정 · 자동 gate</text><rect x="280" y="110" width="210" height="262" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="292" y="132" font-size="14" fill="#e2e8f0" font-weight="800" text-anchor="start">S-02</text><text x="292" y="158" font-size="11" fill="#94a3b8" font-weight="600" text-anchor="start">✓ P-03 ◆critic</text><text x="392" y="158" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">판정 엔진</text><text x="292" y="182" font-size="11" fill="#94a3b8" font-weight="600" text-anchor="start">✓ P-04</text><text x="392" y="182" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">검색</text><text x="292" y="206" font-size="11" fill="#94a3b8" font-weight="600" text-anchor="start">✓ P-05 ◆critic</text><text x="392" y="206" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">LLM Adapter</text><text x="292" y="230" font-size="11" fill="#94a3b8" font-weight="600" text-anchor="start">✓ P-06 ◆critic</text><text x="392" y="230" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">API 핵심</text><text x="292" y="254" font-size="11" fill="#94a3b8" font-weight="600" text-anchor="start">✓ P-07</text><text x="392" y="254" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">알람 발생기</text><text x="292" y="278" font-size="11" fill="#34d399" font-weight="600" text-anchor="start">● P-08</text><text x="392" y="278" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">정비자 앱 진단</text><text x="292" y="302" font-size="11" fill="#34d399" font-weight="600" text-anchor="start">● P-18 ◆critic</text><text x="392" y="302" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">API 진단 미리보기 보강</text><text x="292" y="326" font-size="11" fill="#34d399" font-weight="600" text-anchor="start">● P-19 ◆critic</text><text x="392" y="326" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">API 정비자 화면 값</text><text x="292" y="360" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">첫 end-to-end(SC-04) · 2차 cycle</text><path d="M250 140 L280 140" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#a-emerald)"/><polygon points="385,390 397,402 385,414 373,402" fill="none" stroke="#fbbf24" stroke-width="2"/><text x="385" y="432" font-size="10" fill="#fbbf24" font-weight="600" text-anchor="middle">사람 결정 · 자동 gate</text><rect x="520" y="110" width="210" height="118" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="532" y="132" font-size="14" fill="#e2e8f0" font-weight="800" text-anchor="start">S-03</text><text x="532" y="158" font-size="11" fill="#34d399" font-weight="600" text-anchor="start">● P-09 ◆critic</text><text x="632" y="158" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">API 조치 · 보고서</text><text x="532" y="182" font-size="11" fill="#34d399" font-weight="600" text-anchor="start">● P-10</text><text x="632" y="182" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">정비자 앱 조치 · 보고서</text><text x="532" y="216" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">보고서 확정(SC-06)</text><path d="M490 140 L520 140" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-slate)"/><polygon points="625,246 637,258 625,270 613,258" fill="none" stroke="#fbbf24" stroke-width="2"/><text x="625" y="288" font-size="10" fill="#fbbf24" font-weight="600" text-anchor="middle">사람 결정 · 자동 gate</text><rect x="760" y="110" width="210" height="142" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="772" y="132" font-size="14" fill="#e2e8f0" font-weight="800" text-anchor="start">S-04</text><text x="772" y="158" font-size="11" fill="#34d399" font-weight="600" text-anchor="start">● P-11 ◆critic</text><text x="872" y="158" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">API 파트장</text><text x="772" y="182" font-size="11" fill="#34d399" font-weight="600" text-anchor="start">● P-12</text><text x="872" y="182" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">파트장 앱</text><text x="772" y="206" font-size="11" fill="#34d399" font-weight="600" text-anchor="start">● P-13</text><text x="872" y="206" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">두 앱 교차 E2E</text><text x="772" y="240" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">반려 · 승인(SC-35)</text><path d="M730 140 L760 140" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-slate)"/><polygon points="865,270 877,282 865,294 853,282" fill="none" stroke="#fbbf24" stroke-width="2"/><text x="865" y="312" font-size="10" fill="#fbbf24" font-weight="600" text-anchor="middle">사람 결정 · 자동 gate</text><rect x="1000" y="110" width="210" height="118" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="1012" y="132" font-size="14" fill="#e2e8f0" font-weight="800" text-anchor="start">S-05</text><text x="1012" y="158" font-size="11" fill="#34d399" font-weight="600" text-anchor="start">● P-14 ◆critic</text><text x="1112" y="158" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">API 정정</text><text x="1012" y="182" font-size="11" fill="#34d399" font-weight="600" text-anchor="start">● P-15</text><text x="1112" y="182" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">지난 화면 · 정정 화면</text><text x="1012" y="216" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">정정 · 다시 판정</text><path d="M970 140 L1000 140" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-slate)"/><polygon points="1105,246 1117,258 1105,270 1093,258" fill="none" stroke="#fbbf24" stroke-width="2"/><text x="1105" y="288" font-size="10" fill="#fbbf24" font-weight="600" text-anchor="middle">사람 결정 · 자동 gate</text><rect x="1240" y="110" width="210" height="118" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="1252" y="132" font-size="14" fill="#e2e8f0" font-weight="800" text-anchor="start">S-06</text><text x="1252" y="158" font-size="11" fill="#34d399" font-weight="600" text-anchor="start">● P-16</text><text x="1352" y="158" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">평가 실행기</text><text x="1252" y="182" font-size="11" fill="#34d399" font-weight="600" text-anchor="start">● P-17</text><text x="1352" y="182" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">시연 10건 · 대조</text><text x="1252" y="216" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">평가 · 시연 완료</text><path d="M1210 140 L1240 140" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-slate)"/><polygon points="1345,246 1357,258 1345,270 1333,258" fill="none" stroke="#fbbf24" stroke-width="2"/><text x="1345" y="288" font-size="10" fill="#fbbf24" font-weight="600" text-anchor="middle">사람 결정 · 자동 gate</text><rect x="300" y="520" width="900" height="74" rx="10" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/><text x="316" y="544" font-size="13" fill="#fbbf24" font-weight="700" text-anchor="start">S-03: P-09(조치 · 재가동 · 호출 · 보고서 API) · P-10(정비자 앱 T08 ~ T11) 구현 · G6 pass — A-06(정정 호출 이어 가기 → P-14)</text><text x="316" y="564" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">1차 cycle(P-03 ~ P-07)은 2026-10-13 완료. 첫 판정 호출 경로는 여기서 잠금 화면까지, 호출 요약 화면('점검 전')은 S-03(P-09 · P-10)에서 판정</text><text x="316" y="582" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">이번 승인 요청 범위 = P-08 ~ P-19(●, plan v10). 보고서 · G5 결정은 015 · 016. 별도 승인: 시험 컨테이너 실행 · live OpenAI · commit · push(실행 직전)</text><path d="M435 330 L435 520" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-amber)"/><rect x="450.6" y="459" width="38.8" height="16" rx="4" fill="#0f172a" opacity="0.92"/><text x="470" y="471" font-size="10" fill="#fbbf24" font-weight="600" text-anchor="middle">S-03</text><text x="30" y="640" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">중단 조건(모든 slice): failed_or_missing_automatic_gate · L1_or_out_of_scope_contract_change · new_external_or_separate_approval_action · baseline_drift · repair_cap_exceeded</text><text x="30" y="662" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">자동 gate: scope_traceability · ac_verifier · static_check · typecheck · unit_and_property · api_negative_authority · integration_real_postgres · e2e_surface_journey · prototype_structure_checklist · secret_scan · external_call_zero_in_fixture · leakage_check</text><text x="30" y="684" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">◆critic = 완료 때 read-only 독립 reviewer(P-02 · 03 · 05 · 06 · 09 · 11 · 14 · 18 · 19), S-06 끝에 batch 통합 검토</text><line x1="30" y1="720" x2="66" y2="720" stroke="#34d399" stroke-width="2"/><text x="74" y="724" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">완료 slice → 진행 slice</text><line x1="330" y1="720" x2="366" y2="720" stroke="#64748b" stroke-width="2"/><text x="374" y="724" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">다음 slice(이번 승인 범위)</text><line x1="650" y1="720" x2="686" y2="720" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/><text x="694" y="724" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="start">S-03 · A-06</text></svg>