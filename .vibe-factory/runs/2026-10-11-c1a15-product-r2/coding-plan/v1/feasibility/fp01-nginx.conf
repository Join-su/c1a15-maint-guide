events {}
http {
  server { listen 8081; root /srv/tech; location / { try_files $uri /index.html; }
    location /api/ { proxy_pass http://stub:9000; proxy_set_header X-App tech; } }
  server { listen 8082; root /srv/lead; location / { try_files $uri /index.html; }
    location /api/ { proxy_pass http://stub:9000; proxy_set_header X-App lead; } }
}
