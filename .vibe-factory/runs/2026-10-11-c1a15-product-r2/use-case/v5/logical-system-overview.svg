<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="750" viewBox="0 0 1220 750"><title>정비 길잡이 논리 시스템 개요</title><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1220" height="750" fill="#ffffff"/><text x="40" y="40" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">정비 길잡이 논리 시스템 개요 (logical_system_contract v5)</text><text x="40" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">앱 두 개는 서로 직접 연결되지 않고 진단 처리를 통해서만 데이터를 공유한다. 실제 framework·DB·protocol은 PBC에서 정한다.</text><rect x="40" y="120" width="230" height="70" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="146" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="start">정비자 앱</text><text x="54" y="168" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">정비자 · 태블릿</text><rect x="40" y="330" width="230" height="70" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="54" y="356" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="start">파트장 앱</text><text x="54" y="378" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">파트장 · PC</text><rect x="40" y="470" width="230" height="56" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/><text x="54" y="496" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="start">알람 발생기</text><text x="54" y="518" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">명령 실행</text><rect x="40" y="540" width="230" height="56" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/><text x="54" y="566" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="start">평가 실행기</text><text x="54" y="588" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">평가 모드</text><rect x="40" y="610" width="230" height="56" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/><text x="54" y="636" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="start">적재기</text><text x="54" y="658" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">한 번 실행</text><rect x="420" y="230" width="300" height="210" rx="8" fill="#fff" stroke="#0f172a" stroke-width="1.5"/><text x="434" y="256" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">진단 처리 (공유 처리 경계)</text><rect x="870" y="120" width="300" height="90" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/><text x="884" y="146" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="start">운영 기록</text><text x="884" y="168" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">계정 · 알람 · 세션 · 호출 · 보고서 · 등급표 · 감사</text><rect x="870" y="300" width="300" height="90" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/><text x="884" y="326" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="start">지식 저장소</text><text x="884" y="348" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">매뉴얼 절 · 이력(생성 + 승인 보고서) · 색인</text><rect x="870" y="480" width="300" height="90" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/><text x="884" y="506" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="start">문장 생성기</text><text x="884" y="528" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">live: 외부 LLM(승인 후) / fixture: 템플릿</text><text x="440" y="290" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">· 배정 · 역할 확인</text><text x="440" y="314" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">· 유사 기록 검색 · 원인 순위</text><text x="440" y="338" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">· 다음 점검 · 호출 판정</text><text x="440" y="362" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">· 잠금 · 등급 · 근거 검사</text><text x="440" y="386" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">· 보고서 작성 · 확정 전 확인</text><text x="440" y="410" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">· 승인 → 이력 추가(평가 모드 제외)</text><path d="M270,155 L420,280" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="230.0" y="207.5" width="230" height="18" rx="4" fill="#fff" stroke="#e2e8f0"/><text x="345.0" y="221.5" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">FLOW-02~06 · 13 · 14</text><path d="M270,365 L420,390" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="285.0" y="367.5" width="120" height="18" rx="4" fill="#fff" stroke="#e2e8f0"/><text x="345.0" y="381.5" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">FLOW-07~10</text><path d="M270,498 L420,420" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="301.5" y="449.0" width="87" height="18" rx="4" fill="#fff" stroke="#e2e8f0"/><text x="345.0" y="463.0" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">FLOW-01</text><path d="M270,568 L420,435" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="301.5" y="491.5" width="87" height="18" rx="4" fill="#fff" stroke="#e2e8f0"/><text x="345.0" y="505.5" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">FLOW-12</text><path d="M270,638 L835,638 L835,365 L870,365" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)" stroke-dasharray="2 0"/><path d="M835,365 L835,190 L870,190" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M560,638 L560,638" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="412.0" y="628.0" width="296" height="18" rx="4" fill="#fff" stroke="#e2e8f0"/><text x="560.0" y="642.0" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">FLOW-11 적재(지식 저장소 · 운영 기록)</text><path d="M720,270 L870,165" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="762.5" y="207.5" width="65" height="18" rx="4" fill="#fff" stroke="#e2e8f0"/><text x="795.0" y="221.5" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">기록·조회</text><path d="M720,340 L870,345" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="762.5" y="332.5" width="65" height="18" rx="4" fill="#fff" stroke="#e2e8f0"/><text x="795.0" y="346.5" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">검색·추가</text><path d="M720,410 L870,525" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)" stroke-dasharray="6 4"/><rect x="762.5" y="457.5" width="65" height="18" rx="4" fill="#fff" stroke="#e2e8f0"/><text x="795.0" y="471.5" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">문장 요청</text><text x="40" y="720" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">점선 상자 = 비UI 진입. 점선 화살표 = live 모드에서만 외부로 나가는 호출(사용자 승인 후). 앱은 주기 조회로 새 상태를 읽는다.</text></svg>