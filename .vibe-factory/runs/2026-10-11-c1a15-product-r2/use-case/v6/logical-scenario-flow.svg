<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="840" viewBox="0 0 1180 840"><title>정비 길잡이 논리 scenario 흐름</title><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1180" height="840" fill="#ffffff"/><text x="40" y="40" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">정비 길잡이 논리 scenario 흐름 (대표 경로)</text><text x="40" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">위에서 아래로 시간 순서. 두 앱은 진단 처리를 거쳐서만 상태를 주고받는다. FLOW-01 · 09~14는 개요 그림과 contract JSON 참조.</text><rect x="50" y="84" width="180" height="32" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="140" y="105" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">정비자 앱</text><path d="M140,116 L140,780" stroke="#e2e8f0" stroke-width="2"/><rect x="280" y="84" width="180" height="32" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/><text x="370" y="105" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">진단 처리</text><path d="M370,116 L370,780" stroke="#e2e8f0" stroke-width="2"/><rect x="510" y="84" width="180" height="32" rx="6" fill="#475569" stroke="#475569" stroke-width="1.5"/><text x="600" y="105" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">운영 기록</text><path d="M600,116 L600,780" stroke="#e2e8f0" stroke-width="2"/><rect x="740" y="84" width="180" height="32" rx="6" fill="#475569" stroke="#475569" stroke-width="1.5"/><text x="830" y="105" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">지식 저장소</text><path d="M830,116 L830,780" stroke="#e2e8f0" stroke-width="2"/><rect x="970" y="84" width="180" height="32" rx="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="1060" y="105" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">파트장 앱</text><path d="M1060,116 L1060,780" stroke="#e2e8f0" stroke-width="2"/><path d="M146,140 L362,140" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="255.0" y="133" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">FLOW-02 로그인 · 점검 시작</text><path d="M376,180 L592,180" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="485.0" y="173" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">FLOW-03 세션·단계 저장</text><path d="M376,220 L822,220" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="600.0" y="213" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">유사 기록 검색(상위 10건)</text><path d="M364,260 L148,260" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="255.0" y="253" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">순위 · 다음 점검 1개 · 근거</text><path d="M146,300 L362,300" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="255.0" y="293" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">잠금 완료 → 결과 입력</text><path d="M364,340 L148,340" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="255.0" y="333" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">재순위 → 다음 점검 / 확정 / 호출</text><path d="M146,380 L362,380" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="255.0" y="373" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">FLOW-04 조치 · 재가동 확인</text><path d="M146,420 L362,420" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="255.0" y="413" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">FLOW-05 호출 보내기</text><path d="M376,460 L1052,460" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="715.0" y="453" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">처리할 호출 표시(주기 조회)</text><path d="M1054,500 L378,500" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="715.0" y="493" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">FLOW-08 답(승인 후 진행 등)</text><path d="M364,540 L148,540" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="255.0" y="533" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">답 반영(지시 열림 / 주간 / 직접 확인)</text><path d="M146,580 L362,580" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="255.0" y="573" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">FLOW-06 보고서 확정</text><path d="M376,620 L1052,620" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="715.0" y="613" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">승인 대기 표시</text><path d="M1054,660 L378,660" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="715.0" y="653" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">FLOW-07 승인 · 수정 후 승인 · 반려</text><path d="M376,700 L822,700" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="600.0" y="693" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">승인 보고서 → 이력 추가</text><path d="M364,740 L148,740" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="255.0" y="733" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="middle">반려 → 최근 내 보고서에 사유</text></svg>